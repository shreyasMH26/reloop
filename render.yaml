services:
  - type: web
    name: reloop-platform
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEMO_STORE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: reloop-db
          property: connectionString

databases:
  - name: reloop-db
    plan: free
    databaseName: reloop
    user: reloop_user
